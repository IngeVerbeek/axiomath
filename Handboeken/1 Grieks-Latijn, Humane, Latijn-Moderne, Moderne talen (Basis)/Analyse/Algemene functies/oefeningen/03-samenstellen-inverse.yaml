- id: h3-koppel-1
  soort: koppel
  niveau: 1
  koppel:
    rubriek: analyse
    onderwerp: Exponentiële en logaritmische functies
  thema: |-
    de logaritme als inverse
  opgave: |-
    De functie $f(x) = 2^x$ heeft domein $\R$ en bereik $\left]0, +\infty\right[$, en stijgt overal. Haar inverse is $\log_2 x$. Geef het domein en het bereik van $\log_2$, en bereken $\log_2 8$ en $\log_2\bigl(2^{5}\bigr)$.
  antwoord: |-
    domein $\left]0, +\infty\right[$, bereik $\R$; 3; 5
  uitwerking: |-
    $\dom \log_2 = \ber f = \left]0, +\infty\right[$, $\ber \log_2 = \dom f = \R$. $2^3 = 8$, dus $\log_2 8 = 3$. $\log_2(2^5) = 5$: de inverse draait $f$ terug.

- id: h3-koppel-2
  soort: koppel
  niveau: 2
  koppel:
    rubriek: analyse
    onderwerp: Goniometrische functies
  thema: |-
    een inverse voor de sinus
  opgave: |-
    Waarom heeft $\sin x$ op $\R$ geen inverse? Op welk interval rond $0$ is de sinus wel injectief, met als bereik heel $[-1, 1]$? Geef het domein en het bereik van de inverse $\operatorname{bgsin}$.
  antwoord: |-
    $\left[-\frac{\pi}{2}, \frac{\pi}{2}\right]$; domein $[-1, 1]$, bereik $\left[-\frac{\pi}{2}, \frac{\pi}{2}\right]$
  uitwerking: |-
    $\sin 0 = \sin \pi = 0$: niet injectief. Op $\left[-\frac{\pi}{2}, \frac{\pi}{2}\right]$ stijgt de sinus van $-1$ tot $1$. Dus $\dom \operatorname{bgsin} = [-1, 1]$ en $\ber \operatorname{bgsin} = \left[-\frac{\pi}{2}, \frac{\pi}{2}\right]$.

- id: h3-t1
  soort: test
  niveau: 1
  thema: |-
    samenstellen
  opgave: |-
    Neem $f(x) = \sqrt{x}$ en $g(x) = x^2 - 1$. Bepaal $f \circ g$ en $g \circ f$ met hun domein.
  antwoord: |-
    $\sqrt{x^2 - 1}$ op $\left]-\infty, -1\right] \cup \left[1, +\infty\right[$; $x - 1$ op $\left[0, +\infty\right[$
  uitwerking: |-
    $(f \circ g)(x) = \sqrt{x^2 - 1}$ met domein $\left]-\infty, -1\right] \cup \left[1, +\infty\right[$. $(g \circ f)(x) = x - 1$ met domein $\left[0, +\infty\right[$.

- id: h3-t2
  soort: test
  niveau: 1
  thema: |-
    ontbinden
  opgave: |-
    Schrijf $h(x) = (x^2 - 3)^4$ als samenstelling van twee functies.
  antwoord: |-
    $x^4$ na $x^2 - 3$
  uitwerking: |-
    $g(x) = x^2 - 3$ en $f(x) = x^4$: $h = f \circ g$.

- id: h3-t3
  soort: test
  niveau: 1
  thema: |-
    inverse
  opgave: |-
    Bepaal de inverse van $f(x) = 4 - 3x$, en controleer met één getal.
  antwoord: |-
    $\inv{f}(x) = \dfrac{4 - x}{3}$
  uitwerking: |-
    $y = 4 - 3x \iff x = \frac{4 - y}{3}$. Controle: $f(1) = 1$ en $\inv{f}(1) = 1$; $f(0) = 4$ en $\inv{f}(4) = 0$.

- id: h3-t4
  soort: test
  niveau: 2
  thema: |-
    inverse met domein
  opgave: |-
    Bepaal de inverse van $f(x) = \sqrt{x + 2}$, met haar domein.
  antwoord: |-
    $\inv{f}(x) = x^2 - 2$, $\left[0, +\infty\right[$
  uitwerking: |-
    $\ber f = \left[0, +\infty\right[$. $y = \sqrt{x + 2} \iff x = y^2 - 2$ met $y \geqslant 0$. Dus $\inv{f}(x) = x^2 - 2$ met domein $\left[0, +\infty\right[$.
