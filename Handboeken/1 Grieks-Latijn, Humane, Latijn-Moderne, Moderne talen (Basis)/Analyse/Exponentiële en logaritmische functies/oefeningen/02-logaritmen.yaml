- id: h2-koppel-2
  soort: koppel
  niveau: 2
  koppel:
    rubriek: data
    onderwerp: Kansrekenen
  thema: |-
    bijna zeker een zes
  opgave: |-
    Hoeveel keer moet je minstens met een dobbelsteen gooien om met kans $0{,}99$ minstens één zes te hebben?
  antwoord: |-
    26
  uitwerking: |-
    $1 - \bigl(\frac56\bigr)^n \geqslant 0{,}99 \iff \bigl(\frac56\bigr)^n \leqslant 0{,}01 \iff n \geqslant \frac{\ln 0{,}01}{\ln \frac56} \approx 25{,}3$. Het teken keert om, want $\ln \frac56 < 0$. Dus 26 worpen.

- id: h2-t1
  soort: test
  niveau: 1
  thema: |-
    definitie
  opgave: |-
    Bereken zonder rekentoestel: $\log_2 64$, $\log_{25} 5$ en $\log 0{,}0001$.
  antwoord: |-
    6; $\frac12$; $-4$
  uitwerking: |-
    $2^6 = 64$, $25^{\frac12} = 5$, $10^{-4} = 0{,}0001$.

- id: h2-t2
  soort: test
  niveau: 1
  thema: |-
    rekenregels
  opgave: |-
    Bereken: $\log_2 40 - \log_2 5$ en $\log 2 + \log 50$.
  antwoord: |-
    3; 2
  uitwerking: |-
    $\log_2 8 = 3$ en $\log 100 = 2$.

- id: h2-t3
  soort: test
  niveau: 1
  thema: |-
    rekentoestel
  opgave: |-
    Bereken $\log_3 20$ op drie decimalen en controleer.
  antwoord: |-
    $\approx 2{,}727$
  uitwerking: |-
    $\frac{\ln 20}{\ln 3} \approx 2{,}727$. Controle: $3^{2{,}727} \approx 20{,}0$.

- id: h2-t4
  soort: test
  niveau: 1
  thema: |-
    vergelijking
  opgave: |-
    Los op: $4 \cdot 1{,}5^x = 30$.
  antwoord: |-
    $\approx 4{,}969$
  uitwerking: |-
    $1{,}5^x = 7{,}5$, dus $x = \frac{\ln 7{,}5}{\ln 1{,}5} \approx 4{,}969$.

- id: h2-t5
  soort: test
  niveau: 2
  thema: |-
    verdubbelingstijd
  opgave: |-
    Na hoeveel jaar is een kapitaal verdubbeld bij $4{,}5$\,\% samengestelde intrest per jaar?
  antwoord: |-
    na 16 jaar ($t \approx 15{,}75$)
  uitwerking: |-
    $1{,}045^t = 2$, dus $t = \frac{\ln 2}{\ln 1{,}045} \approx 15{,}75$. Na 16 jaar is het kapitaal verdubbeld.
