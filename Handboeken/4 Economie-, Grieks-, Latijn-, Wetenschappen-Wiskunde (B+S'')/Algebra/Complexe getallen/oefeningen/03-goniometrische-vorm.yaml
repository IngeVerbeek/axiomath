# Oefeningen van hoofdstuk 3. Zie oefeningenbank.py voor de velden.

- id: h3-start-1
  soort: start
  opgave: |-
    \blokkop{Opwarmer}
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        Geef $\cos\frac{2\pi}{3}$ en $\sin\frac{2\pi}{3}$.
      antwoord: |-
        $-\tfrac12$ en $\tfrac{\sqrt3}{2}$
      uitwerking: |-
        $\frac{2\pi}{3} = \pi - \frac{\pi}{3}$ ligt in het tweede kwadrant: $\cos\frac{2\pi}{3} = -\frac12$ en $\sin\frac{2\pi}{3} = \frac{\sqrt3}{2}$.
    - opgave: |-
        Geef $\cos(-\frac{\pi}{4})$ en $\sin(-\frac{\pi}{4})$.
      antwoord: |-
        $\tfrac{\sqrt2}{2}$ en $-\tfrac{\sqrt2}{2}$
      uitwerking: |-
        Vierde kwadrant: $\cos(-\frac{\pi}{4}) = \frac{\sqrt2}{2}$ en $\sin(-\frac{\pi}{4}) = -\frac{\sqrt2}{2}$.
    - opgave: |-
        Zet $150^\circ$ om naar radialen.
      antwoord: |-
        $\tfrac{5\pi}{6}$
      uitwerking: |-
        $150 \cdot \frac{\pi}{180} = \frac{5\pi}{6}$.
    - opgave: |-
        Vul aan: $\cos(\alpha + \beta) = \ldots$ en $\sin(\alpha + \beta) = \ldots$
      antwoord: |-
        $\cos\alpha\cos\beta - \sin\alpha\sin\beta$; \ $\sin\alpha\cos\beta + \cos\alpha\sin\beta$
      uitwerking: |-
        De somformules: $\cos(\alpha + \beta) = \cos\alpha\cos\beta - \sin\alpha\sin\beta$ en $\sin(\alpha + \beta) = \sin\alpha\cos\beta + \cos\alpha\sin\beta$.
    - opgave: |-
        Bereken $|-1 + i\sqrt3|$.
      antwoord: |-
        $2$
      uitwerking: |-
        $\sqrt{1 + 3} = 2$.
    - opgave: |-
        Geef een hoek $\theta \in \, ]-\pi, \pi]$ met $\tan\theta = -1$ en $\cos\theta > 0$.
      antwoord: |-
        $-\tfrac{\pi}{4}$
      uitwerking: |-
        $\cos\theta > 0$ en $\tan\theta < 0$: vierde kwadrant, dus $\theta = -\frac{\pi}{4}$.

- id: h3-verken
  soort: start
  figuur:
    code: |-
      \begin{tikzpicture}[x=.5cm,y=.5cm]
        \gauss{-4}{2}{-1}{3}
      \end{tikzpicture}
  opgave: |-
    \blokkop{Verken}\quad Gegeven: $z = 1 + i$.
  lijst: enumerate
  delen:
    - opgave: |-
        Bereken $z^2$, $z^3$ en $z^4$, en stel $z$, $z^2$, $z^3$ en $z^4$ voor in het vlak van Gauss.
      antwoord: |-
        $2i$, $-2 + 2i$, $-4$
      uitwerking: |-
        $z^2 = 1 + 2i + i^2 = 2i$, \ $z^3 = 2i(1 + i) = -2 + 2i$, \ $z^4 = (2i)^2 = -4$.\par
        \begin{tikzpicture}[x=.5cm,y=.5cm]
          \gauss{-4}{2}{-1}{3}
          \draw[accent!50] (1,1) -- (0,2) -- (-2,2) -- (-4,0);
          \cpunt[right]{1}{1}{$z$}
          \cpunt[right]{0}{2}{$z^2$}
          \cpunt[above]{-2}{2}{$z^3$}
          \cpunt[above]{-4}{0}{$z^4$}
        \end{tikzpicture}
    - opgave: |-
        Bereken de modulus van de vier getallen, en meet de hoek van de positieve reële as naar elk getal.
      antwoord: |-
        moduli $\sqrt2$, $2$, $2\sqrt2$, $4$; hoeken $\frac{\pi}{4}$, $\frac{\pi}{2}$, $\frac{3\pi}{4}$, $\pi$ ($45^\circ$, $90^\circ$, $135^\circ$, $180^\circ$)
      uitwerking: |-
        $|z| = \sqrt2$, $|z^2| = 2$, $|z^3| = \sqrt8 = 2\sqrt2$ en $|z^4| = 4$. De hoeken zijn $\frac{\pi}{4}$, $\frac{\pi}{2}$, $\frac{3\pi}{4}$ en $\pi$.
    - opgave: |-
        Wat gebeurt er met de modulus en met de hoek als je met $z$ vermenigvuldigt?
      antwoord: |-
        de modulus wordt maal $\sqrt2$ gedaan, de hoek wordt $\frac{\pi}{4}$ groter
      uitwerking: |-
        Bij elke vermenigvuldiging met $z$ wordt de modulus vermenigvuldigd met $|z| = \sqrt2$, en komt er bij de hoek $\frac{\pi}{4}$ bij: de hoek van $z$.

- id: h3-omzet
  soort: kort
  opgave: |-
    Schrijf in goniometrische vorm, met de hoofdwaarde van het argument.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $2 + 2i$
      antwoord: |-
        $2\sqrt2\bigl(\cos\frac{\pi}{4} + i\sin\frac{\pi}{4}\bigr)$
      uitwerking: |-
        $r = \sqrt8 = 2\sqrt2$, eerste kwadrant met $a = b$: $\theta = \frac{\pi}{4}$.
    - opgave: |-
        $-\sqrt3 + i$
      antwoord: |-
        $2\bigl(\cos\frac{5\pi}{6} + i\sin\frac{5\pi}{6}\bigr)$
      uitwerking: |-
        $r = 2$, $\cos\theta = -\frac{\sqrt3}{2}$ en $\sin\theta = \frac12$: $\theta = \frac{5\pi}{6}$.
    - opgave: |-
        $-5i$
      antwoord: |-
        $5\bigl(\cos(-\frac{\pi}{2}) + i\sin(-\frac{\pi}{2})\bigr)$
      uitwerking: |-
        Op de negatieve imaginaire as: $r = 5$ en $\theta = -\frac{\pi}{2}$.
    - opgave: |-
        $1 - i\sqrt3$
      antwoord: |-
        $2\bigl(\cos(-\frac{\pi}{3}) + i\sin(-\frac{\pi}{3})\bigr)$
      uitwerking: |-
        $r = 2$, $\cos\theta = \frac12$ en $\sin\theta = -\frac{\sqrt3}{2}$: $\theta = -\frac{\pi}{3}$.
    - opgave: |-
        $-6$
      antwoord: |-
        $6(\cos\pi + i\sin\pi)$
      uitwerking: |-
        Op de negatieve reële as: $r = 6$ en $\theta = \pi$.
    - opgave: |-
        $3 + 4i$
      antwoord: |-
        $5\bigl(\cos 0{,}927 + i\sin 0{,}927\bigr)$
      uitwerking: |-
        $r = 5$, eerste kwadrant: $\theta = \bgtan\frac43 \approx 0{,}927$.

- id: h3-terug
  soort: kort
  opgave: |-
    Schrijf in cartesische vorm.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $6\bigl(\cos\frac{\pi}{3} + i\sin\frac{\pi}{3}\bigr)$
      antwoord: |-
        $3 + 3i\sqrt3$
      uitwerking: |-
        $6\bigl(\frac12 + \frac{\sqrt3}{2}i\bigr) = 3 + 3i\sqrt3$.
    - opgave: |-
        $\sqrt2\bigl(\cos\frac{3\pi}{4} + i\sin\frac{3\pi}{4}\bigr)$
      antwoord: |-
        $-1 + i$
      uitwerking: |-
        $\sqrt2\bigl(-\frac{\sqrt2}{2} + \frac{\sqrt2}{2}i\bigr) = -1 + i$.
    - opgave: |-
        $5\bigl(\cos(-\frac{\pi}{2}) + i\sin(-\frac{\pi}{2})\bigr)$
      antwoord: |-
        $-5i$
      uitwerking: |-
        $5(0 - i) = -5i$.
    - opgave: |-
        $2(\cos 2 + i\sin 2)$, op twee decimalen
      antwoord: |-
        $-0{,}83 + 1{,}82i$
      uitwerking: |-
        Met het rekentoestel in radialen: $2\cos 2 \approx -0{,}83$ en $2\sin 2 \approx 1{,}82$.

- id: h3-product
  soort: kort
  opgave: |-
    Gegeven: $z_1 = 4\bigl(\cos\frac{\pi}{6} + i\sin\frac{\pi}{6}\bigr)$ en $z_2 = 2\bigl(\cos\frac{\pi}{3} + i\sin\frac{\pi}{3}\bigr)$. Bereken in goniometrische vorm, en zet daarna om naar de cartesische vorm.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $z_1 z_2$
      antwoord: |-
        $8\bigl(\cos\frac{\pi}{2} + i\sin\frac{\pi}{2}\bigr) = 8i$
      uitwerking: |-
        $4 \cdot 2 = 8$ en $\frac{\pi}{6} + \frac{\pi}{3} = \frac{\pi}{2}$: $8i$.
    - opgave: |-
        $\dfrac{z_1}{z_2}$
      antwoord: |-
        $2\bigl(\cos(-\frac{\pi}{6}) + i\sin(-\frac{\pi}{6})\bigr) = \sqrt3 - i$
      uitwerking: |-
        $\frac42 = 2$ en $\frac{\pi}{6} - \frac{\pi}{3} = -\frac{\pi}{6}$: $2\bigl(\frac{\sqrt3}{2} - \frac12 i\bigr) = \sqrt3 - i$.
    - opgave: |-
        $z_1^2$
      antwoord: |-
        $16\bigl(\cos\frac{\pi}{3} + i\sin\frac{\pi}{3}\bigr) = 8 + 8i\sqrt3$
      uitwerking: |-
        $z_1 \cdot z_1$: $4 \cdot 4 = 16$ en $\frac{\pi}{6} + \frac{\pi}{6} = \frac{\pi}{3}$: $16\bigl(\frac12 + \frac{\sqrt3}{2}i\bigr) = 8 + 8i\sqrt3$.

- id: h3-draai
  soort: kort
  opgave: |-
    Draai het punt $1 + 2i$ om de oorsprong
  lijst: enumerate
  delen:
    - opgave: |-
        over $\frac{\pi}{2}$;
      antwoord: |-
        $-2 + i$
      uitwerking: |-
        Vermenigvuldig met $\cos\frac{\pi}{2} + i\sin\frac{\pi}{2} = i$: $(1 + 2i)i = -2 + i$.
    - opgave: |-
        over $\frac{\pi}{4}$.
      antwoord: |-
        $\tfrac{\sqrt2}{2}(-1 + 3i)$
      uitwerking: |-
        Vermenigvuldig met $\cos\frac{\pi}{4} + i\sin\frac{\pi}{4} = \frac{\sqrt2}{2}(1 + i)$: $\frac{\sqrt2}{2}(1 + 2i)(1 + i) = \frac{\sqrt2}{2}(1 + i + 2i - 2) = \frac{\sqrt2}{2}(-1 + 3i)$.

#----------------------------------------------------------------------------------------
# OPDRACHTEN: door elkaar, eerst niveau 1, dan 2, dan 3
#----------------------------------------------------------------------------------------

- id: h3-o1
  soort: opdracht
  niveau: 1
  thema: |-
    naar goniometrische vorm
  opgave: |-
    Schrijf in goniometrische vorm, met de hoofdwaarde van het argument.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $-1 - i$
      antwoord: |-
        $\sqrt2\bigl(\cos(-\frac{3\pi}{4}) + i\sin(-\frac{3\pi}{4})\bigr)$
      uitwerking: |-
        $r = \sqrt2$, derde kwadrant met $|a| = |b|$: $\theta = -\frac{3\pi}{4}$.
    - opgave: |-
        $4\sqrt3 - 4i$
      antwoord: |-
        $8\bigl(\cos(-\frac{\pi}{6}) + i\sin(-\frac{\pi}{6})\bigr)$
      uitwerking: |-
        $r = \sqrt{48 + 16} = 8$, $\cos\theta = \frac{\sqrt3}{2}$ en $\sin\theta = -\frac12$: $\theta = -\frac{\pi}{6}$.
    - opgave: |-
        $7i$
      antwoord: |-
        $7\bigl(\cos\frac{\pi}{2} + i\sin\frac{\pi}{2}\bigr)$
      uitwerking: |-
        Op de positieve imaginaire as: $r = 7$, $\theta = \frac{\pi}{2}$.
    - opgave: |-
        $-2 + 2i\sqrt3$
      antwoord: |-
        $4\bigl(\cos\frac{2\pi}{3} + i\sin\frac{2\pi}{3}\bigr)$
      uitwerking: |-
        $r = \sqrt{4 + 12} = 4$, $\cos\theta = -\frac12$ en $\sin\theta = \frac{\sqrt3}{2}$: $\theta = \frac{2\pi}{3}$.
    - opgave: |-
        $-3$
      antwoord: |-
        $3(\cos\pi + i\sin\pi)$
      uitwerking: |-
        $r = 3$ en $\theta = \pi$.

- id: h3-o2
  soort: opdracht
  niveau: 1
  thema: |-
    naar cartesische vorm
  opgave: |-
    Schrijf in cartesische vorm.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $2\bigl(\cos\frac{5\pi}{6} + i\sin\frac{5\pi}{6}\bigr)$
      antwoord: |-
        $-\sqrt3 + i$
      uitwerking: |-
        $2\bigl(-\frac{\sqrt3}{2} + \frac12 i\bigr) = -\sqrt3 + i$.
    - opgave: |-
        $3\bigl(\cos(-\frac{2\pi}{3}) + i\sin(-\frac{2\pi}{3})\bigr)$
      antwoord: |-
        $-\tfrac32 - \tfrac{3\sqrt3}{2} i$
      uitwerking: |-
        $3\bigl(-\frac12 - \frac{\sqrt3}{2}i\bigr) = -\frac32 - \frac{3\sqrt3}{2}i$.
    - opgave: |-
        $10(\cos\pi + i\sin\pi)$
      antwoord: |-
        $-10$
      uitwerking: |-
        $10(-1 + 0i) = -10$.
    - opgave: |-
        $4\bigl(\cos(-\frac{\pi}{4}) + i\sin(-\frac{\pi}{4})\bigr)$
      antwoord: |-
        $2\sqrt2 - 2i\sqrt2$
      uitwerking: |-
        $4\bigl(\frac{\sqrt2}{2} - \frac{\sqrt2}{2}i\bigr) = 2\sqrt2 - 2i\sqrt2$.

- id: h3-o3
  soort: opdracht
  niveau: 1
  thema: |-
    product en quotiënt in goniometrische vorm
  opgave: |-
    Gegeven: $z = 6\bigl(\cos\frac{3\pi}{4} + i\sin\frac{3\pi}{4}\bigr)$ en $w = 3\bigl(\cos\frac{\pi}{4} + i\sin\frac{\pi}{4}\bigr)$. Bereken en schrijf in cartesische vorm.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $zw$
      antwoord: |-
        $-18$
      uitwerking: |-
        $18(\cos\pi + i\sin\pi) = -18$.
    - opgave: |-
        $\dfrac{z}{w}$
      antwoord: |-
        $2i$
      uitwerking: |-
        $2\bigl(\cos\frac{\pi}{2} + i\sin\frac{\pi}{2}\bigr) = 2i$.
    - opgave: |-
        $\dfrac{w}{z}$
      antwoord: |-
        $-\tfrac12 i$
      uitwerking: |-
        $\frac12\bigl(\cos(-\frac{\pi}{2}) + i\sin(-\frac{\pi}{2})\bigr) = -\frac12 i$.

- id: h3-o4
  soort: opdracht
  niveau: 1
  thema: |-
    modulus en argument aflezen
  figuur:
    code: |-
      \begin{tikzpicture}[x=.5cm,y=.5cm]
        \gauss{-3}{3}{-3}{3}
        \cpunt[right]{0}{3}{$A$}
        \cpunt[below left]{-2}{-2}{$B$}
        \cpunt[above]{2}{0}{$C$}
        \cpunt[above left]{-3}{3}{$D$}
        \cpunt[below right]{2}{-2}{$E$}
      \end{tikzpicture}
  opgave: |-
    Geef van elk punt de modulus en de hoofdwaarde van het argument. Schrijf het getal in goniometrische vorm.
  antwoord: |-
    $A$: $3$, $\frac{\pi}{2}$; \ $B$: $2\sqrt2$, $-\frac{3\pi}{4}$; \ $C$: $2$, $0$; \ $D$: $3\sqrt2$, $\frac{3\pi}{4}$; \ $E$: $2\sqrt2$, $-\frac{\pi}{4}$
  uitwerking: |-
    $A = 3i = 3\bigl(\cos\frac{\pi}{2} + i\sin\frac{\pi}{2}\bigr)$.\par
    $B = -2 - 2i = 2\sqrt2\bigl(\cos(-\frac{3\pi}{4}) + i\sin(-\frac{3\pi}{4})\bigr)$.\par
    $C = 2 = 2(\cos 0 + i\sin 0)$.\par
    $D = -3 + 3i = 3\sqrt2\bigl(\cos\frac{3\pi}{4} + i\sin\frac{3\pi}{4}\bigr)$.\par
    $E = 2 - 2i = 2\sqrt2\bigl(\cos(-\frac{\pi}{4}) + i\sin(-\frac{\pi}{4})\bigr)$.

- id: h3-o5
  soort: opdracht
  niveau: 1
  thema: |-
    argument met het rekentoestel
  opgave: |-
    Schrijf in goniometrische vorm. Rond de modulus en het argument af op drie decimalen. Let op het kwadrant.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $3 + 2i$
      antwoord: |-
        $3{,}606(\cos 0{,}588 + i\sin 0{,}588)$
      uitwerking: |-
        $r = \sqrt{13} \approx 3{,}606$, eerste kwadrant: $\theta = \bgtan\frac23 \approx 0{,}588$.
    - opgave: |-
        $-4 + i$
      antwoord: |-
        $4{,}123(\cos 2{,}897 + i\sin 2{,}897)$
      uitwerking: |-
        $r = \sqrt{17} \approx 4{,}123$. Tweede kwadrant: $\bgtan(-\frac14) \approx -0{,}245$ ligt in het vierde, dus $\theta = \pi - 0{,}245 \approx 2{,}897$.
    - opgave: |-
        $-1 - 5i$
      antwoord: |-
        $5{,}099(\cos(-1{,}768) + i\sin(-1{,}768))$
      uitwerking: |-
        $r = \sqrt{26} \approx 5{,}099$. Derde kwadrant: $\bgtan 5 \approx 1{,}373$ ligt in het eerste, dus $\theta = 1{,}373 - \pi \approx -1{,}768$.

- id: h3-o6
  soort: opdracht
  niveau: 2
  thema: |-
    klassieke fouten
  opgave: |-
    Waar of vals? Verbeter wat vals is.
  lijst: enumerate
  delen:
    - opgave: |-
        $\arg(-1 - i) = \frac{\pi}{4}$, want $\tan\frac{\pi}{4} = \frac{-1}{-1} = 1$.
      antwoord: |-
        vals: $-\frac{3\pi}{4}$
      uitwerking: |-
        Vals: $-1 - i$ ligt in het derde kwadrant. De tangens is 1, maar de hoek is $-\frac{3\pi}{4}$.
    - opgave: |-
        $2\bigl(\cos\frac{\pi}{3} - i\sin\frac{\pi}{3}\bigr)$ heeft argument $\frac{\pi}{3}$.
      antwoord: |-
        vals: $-\frac{\pi}{3}$
      uitwerking: |-
        Vals: dit is geen goniometrische vorm. Het is $2\bigl(\cos(-\frac{\pi}{3}) + i\sin(-\frac{\pi}{3})\bigr)$, met argument $-\frac{\pi}{3}$.
    - opgave: |-
        $-3\bigl(\cos\frac{\pi}{4} + i\sin\frac{\pi}{4}\bigr)$ heeft modulus $-3$ en argument $\frac{\pi}{4}$.
      antwoord: |-
        vals: modulus 3, argument $-\frac{3\pi}{4}$
      uitwerking: |-
        Vals: een modulus is nooit negatief. Het minteken is een puntspiegeling, een halve draai: modulus 3 en argument $\frac{\pi}{4} - \pi = -\frac{3\pi}{4}$.
    - opgave: |-
        Het argument van een product is de som van de argumenten, dus $\arg(zw) = \arg z + \arg w$ voor de hoofdwaarden.
      antwoord: |-
        vals: op een veelvoud van $2\pi$ na
      uitwerking: |-
        Vals voor de hoofdwaarden: $\arg(-1) + \arg(-1) = 2\pi$, maar $\arg\bigl((-1)(-1)\bigr) = \arg 1 = 0$. De som is wel een argument van $zw$, maar soms niet de hoofdwaarde.
    - opgave: |-
        $|zw| = |z| \cdot |w|$
      antwoord: |-
        waar
      uitwerking: |-
        Waar: de moduli worden vermenigvuldigd.

- id: h3-o7
  soort: opdracht
  niveau: 2
  thema: |-
    een vierkant construeren
  opgave: |-
    De punten $A = 1 + i$ en $B = 4 + 2i$ zijn twee opeenvolgende hoekpunten van een vierkant $ABCD$, dat links van $AB$ ligt (tegen de wijzers van de klok in). Bepaal $C$ en $D$. Draai daarvoor de vector $B - A$ over $\frac{\pi}{2}$.
  antwoord: |-
    $C = 3 + 5i$, $D = 4i$
  uitwerking: |-
    $B - A = 3 + i$. Een kwartslag: $(3 + i)i = -1 + 3i$. Dan is $C = B + (-1 + 3i) = 3 + 5i$ en $D = A + (-1 + 3i) = 4i$.

- id: h3-o8
  soort: opdracht
  niveau: 2
  thema: |-
    een gelijkzijdige driehoek
  opgave: |-
    Bepaal de punten $P$ zo dat $0$, $4$ en $P$ een gelijkzijdige driehoek vormen.
  antwoord: |-
    $2 + 2i\sqrt3$ of $2 - 2i\sqrt3$
  uitwerking: |-
    Draai $4$ over $\frac{\pi}{3}$ of over $-\frac{\pi}{3}$ om de oorsprong: $4\bigl(\cos\frac{\pi}{3} \pm i\sin\frac{\pi}{3}\bigr) = 4\bigl(\frac12 \pm \frac{\sqrt3}{2}i\bigr) = 2 \pm 2i\sqrt3$.

- id: h3-o9
  soort: opdracht
  niveau: 2
  thema: |-
    modulus en argument van product en quotiënt
  opgave: |-
    Gegeven: $z = 1 + i\sqrt3$ en $w = -1 - i$. Bepaal de modulus en de hoofdwaarde van het argument van $zw$ en van $\dfrac{z}{w}$, zonder het product of het quotiënt uit te rekenen.
  antwoord: |-
    $zw$: $2\sqrt2$, $-\frac{5\pi}{12}$; \ $\frac{z}{w}$: $\sqrt2$, $-\frac{11\pi}{12}$
  uitwerking: |-
    $|z| = 2$ met $\arg z = \frac{\pi}{3}$, en $|w| = \sqrt2$ met $\arg w = -\frac{3\pi}{4}$.\par
    $|zw| = 2\sqrt2$ en $\frac{\pi}{3} - \frac{3\pi}{4} = -\frac{5\pi}{12}$, dat ligt in $]-\pi, \pi]$.\par
    $\bigl|\frac{z}{w}\bigr| = \frac{2}{\sqrt2} = \sqrt2$ en $\frac{\pi}{3} + \frac{3\pi}{4} = \frac{13\pi}{12}$. Dat is groter dan $\pi$: trek $2\pi$ af en je krijgt $-\frac{11\pi}{12}$.

- id: h3-o10
  soort: opdracht
  niveau: 2
  thema: |-
    vermenigvuldigen als draaiing en uitrekking
  opgave: |-
    Alle hoekpunten van een figuur worden vermenigvuldigd met $w = 2\bigl(\cos\frac{\pi}{6} + i\sin\frac{\pi}{6}\bigr)$.
  lijst: enumerate
  delen:
    - opgave: |-
        Beschrijf meetkundig wat er met de figuur gebeurt.
      antwoord: |-
        draaiing over $\frac{\pi}{6}$ om 0, en een vermenigvuldiging met factor 2 vanuit 0
      uitwerking: |-
        Elk punt draait over $\frac{\pi}{6}$ om de oorsprong, en zijn afstand tot de oorsprong wordt verdubbeld.
    - opgave: |-
        Wat gebeurt er met de lengte van de zijden en met de oppervlakte?
      antwoord: |-
        lengtes maal 2, oppervlakte maal 4
      uitwerking: |-
        $|wz_1 - wz_2| = |w| \cdot |z_1 - z_2| = 2|z_1 - z_2|$: elke lengte wordt verdubbeld. De oppervlakte wordt dan met $2^2 = 4$ vermenigvuldigd.
    - opgave: |-
        Met welk getal moet je vermenigvuldigen om de figuur terug op haar plaats te krijgen?
      antwoord: |-
        $\frac{1}{w} = \frac12\bigl(\cos(-\frac{\pi}{6}) + i\sin(-\frac{\pi}{6})\bigr)$
      uitwerking: |-
        Met $\frac{1}{w} = \frac12\bigl(\cos(-\frac{\pi}{6}) + i\sin(-\frac{\pi}{6})\bigr) = \frac{\sqrt3}{4} - \frac14 i$: terugdraaien en halveren.

- id: h3-o11
  soort: opdracht
  niveau: 2
  thema: |-
    context: windmolen
  opgave: |-
    We leggen het vlak van Gauss in het vlak van de wieken van een windmolen, met de as in de oorsprong en de meter als eenheid. Het uiteinde van een wiek staat in $20 + 15i$. De wieken draaien tegen de wijzers van de klok in, over $\frac{\pi}{10}$ per seconde.
  lijst: enumerate
  delen:
    - opgave: |-
        Hoe lang is de wiek?
      antwoord: |-
        $25$ m
      uitwerking: |-
        $|20 + 15i| = \sqrt{400 + 225} = 25$ m.
    - opgave: |-
        Waar staat het uiteinde na 5 seconden? En na 1 seconde, op cm nauwkeurig?
      antwoord: |-
        $-15 + 20i$; \ $14{,}39 + 20{,}45i$
      uitwerking: |-
        Na 5 seconden is de wiek over $\frac{\pi}{2}$ gedraaid: $(20 + 15i)i = -15 + 20i$.\par
        Na 1 seconde: $(20 + 15i)\bigl(\cos\frac{\pi}{10} + i\sin\frac{\pi}{10}\bigr) \approx (20 + 15i)(0{,}95106 + 0{,}30902i) \approx 14{,}39 + 20{,}45i$.
    - opgave: |-
        Na hoeveel seconden staat het uiteinde voor het eerst terug in $20 + 15i$?
      antwoord: |-
        na 20 seconden
      uitwerking: |-
        Een volle toer is $2\pi = 20 \cdot \frac{\pi}{10}$: na 20 seconden.

- id: h3-o12
  soort: opdracht
  niveau: 3
  thema: |-
    z gedeeld door z streep
  opgave: |-
    Neem $z = r(\cos\theta + i\sin\theta)$ met $r > 0$.
  lijst: enumerate
  delen:
    - opgave: |-
        Schrijf $\conj{z}$ in goniometrische vorm, en toon aan dat $\dfrac{z}{\conj{z}} = \cos 2\theta + i\sin 2\theta$.
      antwoord: |-
        $\conj{z} = r(\cos(-\theta) + i\sin(-\theta))$
      uitwerking: |-
        $\conj{z} = r\cos\theta - ir\sin\theta = r(\cos(-\theta) + i\sin(-\theta))$, want de cosinus is even en de sinus oneven. Met de regel voor het quotiënt: $\frac{z}{\conj{z}} = \frac{r}{r}\bigl(\cos(\theta + \theta) + i\sin(\theta + \theta)\bigr) = \cos 2\theta + i\sin 2\theta$.
    - opgave: |-
        Voor welke $z$ is $\dfrac{z}{\conj{z}} = i$? Waar liggen die punten?
      antwoord: |-
        argument $\frac{\pi}{4}$ of $-\frac{3\pi}{4}$: de rechte $y = x$ zonder 0
      uitwerking: |-
        $\cos 2\theta + i\sin 2\theta = i$ als $2\theta = \frac{\pi}{2} + k \cdot 2\pi$, dus $\theta = \frac{\pi}{4} + k\pi$. Met een hoofdwaarde: $\theta = \frac{\pi}{4}$ of $\theta = -\frac{3\pi}{4}$, en $r > 0$ willekeurig. Dat zijn alle punten van de rechte $y = x$, behalve de oorsprong.

- id: h3-o13
  soort: opdracht
  niveau: 3
  thema: |-
    hoek tussen twee vectoren
  opgave: |-
    De hoek van de vector $z$ naar de vector $w$ is $\arg\dfrac{w}{z}$. Bereken zo de hoek bij de oorsprong in de driehoek met hoekpunten $0$, $3 + i$ en $1 + 2i$. Leg uit waarom de formule klopt.
  antwoord: |-
    $\frac{\pi}{4}$
  uitwerking: |-
    $\frac{1 + 2i}{3 + i} = \frac{(1 + 2i)(3 - i)}{10} = \frac{5 + 5i}{10} = \frac12 + \frac12 i$, met argument $\frac{\pi}{4}$. De hoek is dus $\frac{\pi}{4}$.\par
    Het argument van $\frac{w}{z}$ is $\arg w - \arg z$ (op een veelvoud van $2\pi$ na): het verschil van de hoeken van de twee vectoren met de reële as.

- id: h3-o14
  soort: opdracht
  niveau: 3
  thema: |-
    draaien om een ander punt
  opgave: |-
    Draai het punt $z = 3 + 2i$ over $\frac{\pi}{2}$ om het punt $c = 1 + i$. Verschuif daarvoor eerst $c$ naar de oorsprong, draai, en verschuif terug. Schrijf de draaiing als één formule.
  antwoord: |-
    $3i$; \ $z \mapsto i(z - c) + c$
  uitwerking: |-
    $z - c = 2 + i$. Draaien: $(2 + i)i = -1 + 2i$. Terug verschuiven: $-1 + 2i + 1 + i = 3i$. In één formule: $z \mapsto i(z - c) + c$, en voor een draaiing over $\alpha$: $z \mapsto (\cos\alpha + i\sin\alpha)(z - c) + c$.

#----------------------------------------------------------------------------------------
# KOPPEL
#----------------------------------------------------------------------------------------

- id: h3-koppel-1
  soort: koppel
  niveau: 2
  koppel:
    rubriek: analyse
    onderwerp: Goniometrische functies
  thema: |-
    goniometrische formules uit complexe getallen
  opgave: |-
    Met de goniometrische vorm vind je formules en exacte waarden uit de goniometrie terug.
  lijst: enumerate
  delen:
    - opgave: |-
        Bereken $(\cos\theta + i\sin\theta)^2$ op twee manieren: met de regel voor het product, en door de haakjes uit te werken. Welke formules vind je?
      antwoord: |-
        $\cos 2\theta = \cos^2\theta - \sin^2\theta$ en $\sin 2\theta = 2\sin\theta\cos\theta$
      uitwerking: |-
        Met de regel voor het product: $\cos 2\theta + i\sin 2\theta$. Uitgewerkt: $\cos^2\theta + 2i\sin\theta\cos\theta + i^2\sin^2\theta = (\cos^2\theta - \sin^2\theta) + 2i\sin\theta\cos\theta$. Reële en imaginaire delen gelijkstellen geeft de verdubbelingsformules.
    - opgave: |-
        Bereken $\dfrac{\cos\frac{\pi}{3} + i\sin\frac{\pi}{3}}{\cos\frac{\pi}{4} + i\sin\frac{\pi}{4}}$ op twee manieren, en leid de exacte waarden van $\cos\frac{\pi}{12}$ en $\sin\frac{\pi}{12}$ af.
      antwoord: |-
        $\cos\frac{\pi}{12} = \frac{\sqrt6 + \sqrt2}{4}$, $\sin\frac{\pi}{12} = \frac{\sqrt6 - \sqrt2}{4}$
      uitwerking: |-
        In goniometrische vorm is het quotiënt $\cos\frac{\pi}{12} + i\sin\frac{\pi}{12}$. Cartesisch: de noemer heeft modulus 1, dus delen is vermenigvuldigen met de toegevoegde:
        $\bigl(\frac12 + \frac{\sqrt3}{2}i\bigr)\bigl(\frac{\sqrt2}{2} - \frac{\sqrt2}{2}i\bigr) = \frac{\sqrt2}{4}(1 + i\sqrt3)(1 - i) = \frac{\sqrt2}{4}\bigl((1 + \sqrt3) + (\sqrt3 - 1)i\bigr)$.
        Dus $\cos\frac{\pi}{12} = \frac{\sqrt2 + \sqrt6}{4}$ en $\sin\frac{\pi}{12} = \frac{\sqrt6 - \sqrt2}{4}$.

- id: h3-koppel-2
  soort: koppel
  niveau: 2
  koppel:
    rubriek: algebra
    onderwerp: Matrices
  thema: |-
    draaiingsmatrices
  opgave: |-
    In hoofdstuk 1 hoorde bij $z = a + bi$ de matrix $M(z) = \begin{bmatrix} a & -b \\ b & a \end{bmatrix}$, en het product van matrices bij het product van complexe getallen. Noem $R(\alpha) = M(\cos\alpha + i\sin\alpha)$.
  lijst: enumerate
  delen:
    - opgave: |-
        Schrijf $R(\alpha)$ uit. Wat doet $R(\alpha)$ met een kolom $\begin{bmatrix} x \\ y \end{bmatrix}$, als je die ziet als het punt $x + yi$?
      antwoord: |-
        $\begin{bmatrix} \cos\alpha & -\sin\alpha \\ \sin\alpha & \cos\alpha \end{bmatrix}$: een draaiing over $\alpha$
      uitwerking: |-
        $R(\alpha) = \begin{bmatrix} \cos\alpha & -\sin\alpha \\ \sin\alpha & \cos\alpha \end{bmatrix}$. Het product met de kolom is $\begin{bmatrix} x\cos\alpha - y\sin\alpha \\ x\sin\alpha + y\cos\alpha \end{bmatrix}$: dat zijn het reëel en het imaginair deel van $(\cos\alpha + i\sin\alpha)(x + yi)$, het punt gedraaid over $\alpha$.
    - opgave: |-
        Leg uit waarom $R(\alpha) \cdot R(\beta) = R(\alpha + \beta)$, zonder te rekenen.
      antwoord: |-
        het product van de complexe getallen heeft argument $\alpha + \beta$
      uitwerking: |-
        $R(\alpha)R(\beta) = M\bigl((\cos\alpha + i\sin\alpha)(\cos\beta + i\sin\beta)\bigr) = M\bigl(\cos(\alpha + \beta) + i\sin(\alpha + \beta)\bigr) = R(\alpha + \beta)$. Meetkundig: twee draaiingen na elkaar zijn één draaiing over de som van de hoeken.

#----------------------------------------------------------------------------------------
# TEST JEZELF
#----------------------------------------------------------------------------------------

- id: h3-t1
  soort: test
  niveau: 1
  thema: |-
    naar goniometrische vorm
  opgave: |-
    Schrijf $-2 + 2i$ in goniometrische vorm.
  antwoord: |-
    $2\sqrt2\bigl(\cos\frac{3\pi}{4} + i\sin\frac{3\pi}{4}\bigr)$
  uitwerking: |-
    $r = \sqrt8 = 2\sqrt2$, tweede kwadrant met $|a| = |b|$: $\theta = \frac{3\pi}{4}$.

- id: h3-t2
  soort: test
  niveau: 1
  thema: |-
    naar goniometrische vorm, derde kwadrant
  opgave: |-
    Schrijf $-\sqrt3 - i$ in goniometrische vorm, met de hoofdwaarde van het argument.
  antwoord: |-
    $2\bigl(\cos(-\frac{5\pi}{6}) + i\sin(-\frac{5\pi}{6})\bigr)$
  uitwerking: |-
    $r = 2$, $\cos\theta = -\frac{\sqrt3}{2}$ en $\sin\theta = -\frac12$: derde kwadrant, $\theta = -\pi + \frac{\pi}{6} = -\frac{5\pi}{6}$.

- id: h3-t3
  soort: test
  niveau: 1
  thema: |-
    naar cartesische vorm
  opgave: |-
    Schrijf $6\bigl(\cos(-\frac{\pi}{3}) + i\sin(-\frac{\pi}{3})\bigr)$ in cartesische vorm.
  antwoord: |-
    $3 - 3i\sqrt3$
  uitwerking: |-
    $6\bigl(\frac12 - \frac{\sqrt3}{2}i\bigr) = 3 - 3i\sqrt3$.

- id: h3-t4
  soort: test
  niveau: 1
  thema: |-
    product en quotiënt
  opgave: |-
    Gegeven: $z = 2\bigl(\cos\frac{2\pi}{3} + i\sin\frac{2\pi}{3}\bigr)$ en $w = 4\bigl(\cos\frac{\pi}{6} + i\sin\frac{\pi}{6}\bigr)$. Bereken $zw$ en $\dfrac{z}{w}$ in goniometrische en in cartesische vorm.
  antwoord: |-
    $8\bigl(\cos\frac{5\pi}{6} + i\sin\frac{5\pi}{6}\bigr) = -4\sqrt3 + 4i$; \ $\frac12\bigl(\cos\frac{\pi}{2} + i\sin\frac{\pi}{2}\bigr) = \frac12 i$
  uitwerking: |-
    $zw = 8\bigl(\cos\frac{5\pi}{6} + i\sin\frac{5\pi}{6}\bigr) = 8\bigl(-\frac{\sqrt3}{2} + \frac12 i\bigr) = -4\sqrt3 + 4i$.\par
    $\frac{z}{w} = \frac12\bigl(\cos\frac{\pi}{2} + i\sin\frac{\pi}{2}\bigr) = \frac12 i$.

- id: h3-t5
  soort: test
  niveau: 2
  thema: |-
    draaien
  opgave: |-
    Draai het punt $\sqrt3 + i$ over $\frac{\pi}{3}$ om de oorsprong.
  antwoord: |-
    $2i$
  uitwerking: |-
    $\sqrt3 + i = 2\bigl(\cos\frac{\pi}{6} + i\sin\frac{\pi}{6}\bigr)$. Draaien over $\frac{\pi}{3}$ geeft $2\bigl(\cos\frac{\pi}{2} + i\sin\frac{\pi}{2}\bigr) = 2i$.

- id: h3-t6
  soort: test
  niveau: 2
  thema: |-
    argument met het rekentoestel
  opgave: |-
    Schrijf $-3 + 4i$ in goniometrische vorm, met het argument op drie decimalen.
  antwoord: |-
    $5(\cos 2{,}214 + i\sin 2{,}214)$
  uitwerking: |-
    $r = 5$. Tweede kwadrant: $\bgtan(-\frac43) \approx -0{,}927$, dus $\theta = \pi - 0{,}927 \approx 2{,}214$.
