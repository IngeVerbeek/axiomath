# Oefeningen van hoofdstuk 2. Zie oefeningenbank.py voor de velden.

- id: h2-start-1
  soort: start
  opgave: |-
    \blokkop{Opwarmer}
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        Vereenvoudig: $\dfrac{x^2 - 9}{x + 3}$.
      antwoord: |-
        $x - 3$ (voor $x \neq -3$)
      uitwerking: |-
        $\frac{(x - 3)(x + 3)}{x + 3} = x - 3$.
    - opgave: |-
        Bereken $\frac{1}{x}$ voor $x = 0{,}01$ en $x = -0{,}01$.
      antwoord: |-
        $100$; $-100$
      uitwerking: |-
        $100$ en $-100$.
    - opgave: |-
        Bereken $\frac{2x + 1}{x}$ voor $x = 1000$.
      antwoord: |-
        $2{,}001$
      uitwerking: |-
        $\frac{2001}{1000} = 2{,}001$.
    - opgave: |-
        Deel met Horner: $(x^2 + 3x + 5) : (x + 1)$.
      antwoord: |-
        $Q = x + 2$, $R = 3$
      uitwerking: |-
        Onderste rij $1, 2, 3$.

- id: h2-verken
  soort: start
  opgave: |-
    \blokkop{Verken} De gemiddelde kostprijs per stuk is $G(q) = \dfrac{500 + 2q}{q}$ euro, bij $q$ stuks.
  lijst: enumerate
  delen:
    - opgave: |-
        Bereken $G(10)$, $G(100)$, $G(1000)$ en $G(10\,000)$. Welk getal benaderen ze?
      antwoord: |-
        $52$; $7$; $2{,}5$; $2{,}05$; het getal 2
      uitwerking: |-
        $52$, $7$, $2{,}5$ en $2{,}05$: ze naderen $2$, de kostprijs per stuk zonder vaste kosten.
    - opgave: |-
        Wat gebeurt er met $G(q)$ als $q$ heel klein wordt (bijvoorbeeld $q = 1$ of $q = 0{,}1$)?
      antwoord: |-
        $G$ wordt heel groot
      uitwerking: |-
        $G(1) = 502$, $G(0{,}1) = 5002$: de vaste kosten verdeeld over bijna niets.
    - opgave: |-
        Schrijf $G(q)$ als $2 + \ldots$ Wat zie je?
      antwoord: |-
        $G(q) = 2 + \frac{500}{q}$
      uitwerking: |-
        $G(q) = 2 + \frac{500}{q}$: de grafiek van $\frac{500}{q}$, $2$ naar boven geschoven.

- id: h2-domein
  soort: kort
  opgave: |-
    Bepaal domein, nulwaarden en perforaties.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $f(x) = \dfrac{x^2 - x}{x^2 - 1}$
      antwoord: |-
        $\R \setminus \{-1, 1\}$; $0$; perforatie $(1, \frac12)$
      uitwerking: |-
        $\frac{x(x - 1)}{(x - 1)(x + 1)} = \frac{x}{x + 1}$ voor $x \neq 1$. Nulwaarde $0$, perforatie in $\bigl(1, \frac12\bigr)$.
    - opgave: |-
        $g(x) = \dfrac{x + 3}{x^2 + 2x - 3}$
      antwoord: |-
        $\R \setminus \{-3, 1\}$; geen; perforatie $(-3, -\frac14)$
      uitwerking: |-
        $\frac{x + 3}{(x + 3)(x - 1)} = \frac{1}{x - 1}$ voor $x \neq -3$. Geen nulwaarden, perforatie in $\bigl(-3, -\frac14\bigr)$.

- id: h2-asymptoten
  soort: kort
  opgave: |-
    Bepaal alle asymptoten.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $\dfrac{3x - 1}{x + 2}$
      antwoord: |-
        $x = -2$; $y = 3$
      uitwerking: |-
        VA $x = -2$; zelfde graad: HA $y = 3$.
    - opgave: |-
        $\dfrac{x}{x^2 + 1}$
      antwoord: |-
        $y = 0$
      uitwerking: |-
        Geen VA (noemer nooit nul); graad teller kleiner: HA $y = 0$.
    - opgave: |-
        $\dfrac{x^2 - 3}{x + 1}$
      antwoord: |-
        $x = -1$; $y = x - 1$
      uitwerking: |-
        Horner met $a = -1$: $1, -1, -2$, dus $x - 1 - \frac{2}{x + 1}$. VA $x = -1$, SA $y = x - 1$.

- id: h2-schets
  soort: kort
  opgave: |-
    Schets de grafiek van $f(x) = \dfrac{2x}{x - 1}$. Geef asymptoten, nulwaarde en tekentabel.
  antwoord: |-
    $x = 1$; $y = 2$; nulwaarde $0$
  uitwerking: |-
    $f(x) = 2 + \frac{2}{x - 1}$: VA $x = 1$, HA $y = 2$, nulwaarde $0$. \tekentabel{cccccc}{x & & 0 & & 1 & }{f(x) & + & 0 & - & | & +}

#----------------------------------------------------------------------------------------
# OPDRACHTEN: door elkaar, eerst niveau 1, dan 2, dan 3
#----------------------------------------------------------------------------------------

- id: h2-o1
  soort: opdracht
  niveau: 1
  thema: |-
    domein en vereenvoudigen
  opgave: |-
    Bepaal het domein en vereenvoudig.
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        $\dfrac{x^2 + 2x}{x^2 - 4}$
      antwoord: |-
        $\R \setminus \{-2, 2\}$; $\frac{x}{x - 2}$
      uitwerking: |-
        $\frac{x(x + 2)}{(x - 2)(x + 2)} = \frac{x}{x - 2}$ voor $x \neq -2$.
    - opgave: |-
        $\dfrac{x^3 - x}{x^2 + x}$
      antwoord: |-
        $\R \setminus \{-1, 0\}$; $x - 1$
      uitwerking: |-
        $\frac{x(x - 1)(x + 1)}{x(x + 1)} = x - 1$ voor $x \neq 0, -1$: een rechte met twee gaten.

- id: h2-o2
  soort: opdracht
  niveau: 1
  thema: |-
    asymptoten
  opgave: |-
    Bepaal alle asymptoten.
  lijst: reeks
  kolommen: 3
  delen:
    - opgave: |-
        $\dfrac{5}{x^2 - 9}$
      antwoord: |-
        $x = \pm 3$; $y = 0$
      uitwerking: |-
        VA $x = -3$ en $x = 3$, HA $y = 0$.
    - opgave: |-
        $\dfrac{4x^2}{2x^2 + x - 1}$
      antwoord: |-
        $x = -1$, $x = \frac12$; $y = 2$
      uitwerking: |-
        $2x^2 + x - 1 = (2x - 1)(x + 1)$: VA $x = -1$ en $x = \frac12$. HA $y = \frac42 = 2$.
    - opgave: |-
        $\dfrac{2x^2 + 3x}{x - 2}$
      antwoord: |-
        $x = 2$; $y = 2x + 7$
      uitwerking: |-
        Horner met $a = 2$: $2, 7, 14$, dus $2x + 7 + \frac{14}{x - 2}$. VA $x = 2$, SA $y = 2x + 7$.

- id: h2-o3
  soort: opdracht
  niveau: 1
  thema: |-
    homografische functie
  opgave: |-
    Schrijf $f(x) = \dfrac{2x + 1}{x - 1}$ als $c + \dfrac{a}{x - p}$. Uit welke basisfunctie ontstaat de grafiek, en hoe? Geef de asymptoten.
  antwoord: |-
    $2 + \frac{3}{x - 1}$; $x = 1$ en $y = 2$
  uitwerking: |-
    $2x + 1 = 2(x - 1) + 3$, dus $f(x) = 2 + \frac{3}{x - 1}$: de grafiek van $\frac1x$, verticaal $\times 3$, 1 naar rechts, 2 naar boven. Asymptoten $x = 1$ en $y = 2$.

- id: h2-o4
  soort: opdracht
  niveau: 2
  thema: |-
    volledig schetsen
  opgave: |-
    Schets de grafiek van $f(x) = \dfrac{x^2}{x^2 - 1}$ met de werkwijze. Welke symmetrie heeft ze?
  antwoord: |-
    VA $x = \pm 1$; HA $y = 1$; nulwaarde $0$ (raakt)
  uitwerking: |-
    Domein $\R \setminus \{\pm 1\}$, nulwaarde $0$, VA $x = -1$ en $x = 1$, HA $y = 1$. $f$ is even: symmetrisch om de $y$-as. \tekentabel{cccccccc}{x & & -1 & & 0 & & 1 & }{f(x) & + & | & - & 0 & - & | & +}

- id: h2-o5
  soort: opdracht
  niveau: 2
  thema: |-
    voorschrift uit asymptoten
  figuur:
    opties: |-
      4.4cm
    code: |-
      \begin{tikzpicture}[x=.45cm,y=.45cm,font=\scriptsize]
        \rooster{-3}{1}{5}{-3}{1}{4}
        \draw[grijs,dashed] (1,-3) -- (1,4.3) (-3,-1) -- (5.3,-1);
        \kromme{-3}{.2}{2/(\x-1)-1} \kromme{1.4}{5}{2/(\x-1)-1}
        \vol{(3,0)} \vol{(0,-3)}
      \end{tikzpicture}
  opgave: |-
    De grafiek hiernaast is van de vorm $f(x) = c + \dfrac{a}{x - p}$, met asymptoten $x = 1$ en $y = -1$, en gaat door $(3, 0)$. Geef het voorschrift.
  antwoord: |-
    $f(x) = -1 + \frac{2}{x - 1}$
  uitwerking: |-
    $p = 1$ en $c = -1$. $f(3) = -1 + \frac{a}{2} = 0$, dus $a = 2$. Controle: $f(0) = -3$.

- id: h2-o6
  soort: opdracht
  niveau: 2
  thema: |-
    snijpunt met de asymptoot
  opgave: |-
    Neem $f(x) = \dfrac{x + 1}{x^2}$. Bepaal de asymptoten en onderzoek of de grafiek de horizontale asymptoot snijdt. Kan dat ook bij een verticale asymptoot?
  antwoord: |-
    ja; $x = 0$, $y = 0$; snijpunt $(-1, 0)$
  uitwerking: |-
    VA $x = 0$, HA $y = 0$. $f(x) = 0$ voor $x = -1$: de grafiek snijdt de asymptoot in $(-1, 0)$. Een asymptoot zegt alleen iets over het gedrag voor grote $|x|$. Een verticale asymptoot kan de grafiek wel nooit snijden.

- id: h2-o7
  soort: opdracht
  niveau: 3
  thema: |-
    een functie ontwerpen
  opgave: |-
    Geef een rationale functie met verticale asymptoten $x = -1$ en $x = 3$, horizontale asymptoot $y = 2$, en een nulwaarde in $0$.
  antwoord: |-
    bijvoorbeeld $\frac{2x(x - 1)}{(x + 1)(x - 3)}$
  uitwerking: |-
    Noemer $(x + 1)(x - 3)$, teller van graad 2 met hoogstegraadscoëfficiënt $2$ en nulwaarde $0$: bijvoorbeeld $2x(x - 1)$. Controle: de teller is niet nul in $-1$ of $3$, dus geen perforaties. Ook $\frac{2x^2}{(x + 1)(x - 3)}$ kan.

- id: h2-o8
  soort: opdracht
  niveau: 3
  thema: |-
    gemiddelde kost
  opgave: |-
    Een bedrijf heeft $1200$ euro vaste kosten. Elk stuk kost $5$ euro aan materiaal, en door overuren komt daar per stuk $0{,}01q$ euro bij als er $q$ stuks gemaakt worden. De totale kost is dus $K(q) = 1200 + 5q + 0{,}01q^2$.
  lijst: enumerate
  delen:
    - opgave: |-
        Geef de gemiddelde kost $G(q) = \frac{K(q)}{q}$ en haar asymptoten.
      antwoord: |-
        $G(q) = \frac{1200}{q} + 5 + 0{,}01q$; $q = 0$ en $y = 0{,}01q + 5$
      uitwerking: |-
        $G(q) = 0{,}01q + 5 + \frac{1200}{q}$: VA $q = 0$, SA $y = 0{,}01q + 5$.
    - opgave: |-
        Bereken $G(100)$, $G(300)$, $G(350)$ en $G(500)$. Wat valt op?
      antwoord: |-
        $18$; $12$; $\approx 11{,}93$; $12{,}4$
      uitwerking: |-
        $18$, $12$, $11{,}93$ en $12{,}40$ euro: de gemiddelde kost daalt eerst (de vaste kosten worden verdeeld) en stijgt dan weer (de overuren). Ergens tussen $300$ en $500$ ligt een minimum (bij $q \approx 346$, zie later met afgeleiden).

#----------------------------------------------------------------------------------------
# KOPPEL
#----------------------------------------------------------------------------------------

- id: h2-koppel-1
  soort: koppel
  niveau: 1
  koppel:
    rubriek: analyse
    onderwerp: Algemene functies
  thema: |-
    inverse van een homografische functie
  opgave: |-
    Bepaal de inverse van $f(x) = \dfrac{x + 2}{x - 1}$. Wat merk je op? Wat betekent dat voor de grafiek?
  antwoord: |-
    $\inv{f} = f$; symmetrisch om $y = x$
  uitwerking: |-
    $y(x - 1) = x + 2 \iff x(y - 1) = y + 2 \iff x = \frac{y + 2}{y - 1}$. Dus $\inv{f} = f$: de grafiek is symmetrisch ten opzichte van $y = x$. Ook de asymptoten $x = 1$ en $y = 1$ zijn elkaars spiegelbeeld.

- id: h2-koppel-2
  soort: koppel
  niveau: 2
  koppel:
    rubriek: analyse
    onderwerp: Limieten en afgeleiden
  thema: |-
    een asymptoot als limiet
  opgave: |-
    Bereken $f(x) - (x + 2)$ voor $f(x) = \dfrac{x^2 + x - 1}{x - 1}$ en $x = 10$, $100$, $1000$. Wat gebeurt er met het verschil? Hoe schrijf je dat met een limiet?
  antwoord: |-
    $\frac19$; $\frac{1}{99}$; $\frac{1}{999}$; het nadert 0
  uitwerking: |-
    Het verschil is $\frac{1}{x - 1}$: $0{,}111$, $0{,}0101$, $0{,}001$. Het nadert 0: $\lim_{x \to +\infty} \bigl(f(x) - (x + 2)\bigr) = 0$. Dat is de definitie van een schuine asymptoot.

- id: h2-koppel-3
  soort: koppel
  niveau: 2
  koppel:
    rubriek: analyse
    onderwerp: Integralen
  thema: |-
    splitsen voor een primitieve
  opgave: |-
    Schrijf $f(x) = \dfrac{x^2 + x - 1}{x - 1}$ als $x + 2 + \frac{1}{x - 1}$ en bereken $\int_2^3 f(x)\,\mathrm{d}x$. Een primitieve van $\frac{1}{x - 1}$ is $\ln|x - 1|$.
  antwoord: |-
    $\frac92 + \ln 2 \approx 5{,}19$
  uitwerking: |-
    $\Bigl[\frac{x^2}{2} + 2x + \ln|x - 1|\Bigr]_2^3 = \bigl(4{,}5 + 6 + \ln 2\bigr) - (2 + 4 + 0) = 4{,}5 + \ln 2 \approx 5{,}19$.

#----------------------------------------------------------------------------------------
# TEST JEZELF
#----------------------------------------------------------------------------------------

- id: h2-t1
  soort: test
  niveau: 1
  thema: |-
    perforatie
  opgave: |-
    Bepaal domein, nulwaarden en perforaties van $f(x) = \dfrac{x^2 - 3x}{x^2 - 9}$.
  antwoord: |-
    $\R \setminus \{-3, 3\}$; $0$; perforatie $(3, \frac12)$
  uitwerking: |-
    $\frac{x(x - 3)}{(x - 3)(x + 3)} = \frac{x}{x + 3}$ voor $x \neq 3$. Nulwaarde $0$, perforatie in $\bigl(3, \frac12\bigr)$.

- id: h2-t2
  soort: test
  niveau: 1
  thema: |-
    horizontale asymptoot
  opgave: |-
    Bepaal de asymptoten van $f(x) = \dfrac{3x^2 - 2}{x^2 - 4}$.
  antwoord: |-
    $x = \pm 2$; $y = 3$
  uitwerking: |-
    VA $x = -2$ en $x = 2$ (de teller is daar $10 \neq 0$). HA $y = 3$.

- id: h2-t3
  soort: test
  niveau: 2
  thema: |-
    schuine asymptoot
  opgave: |-
    Bepaal de asymptoten van $f(x) = \dfrac{x^2 - 2x + 3}{x + 1}$.
  antwoord: |-
    $x = -1$; $y = x - 3$
  uitwerking: |-
    Horner met $a = -1$: $1, -3, 6$, dus $f(x) = x - 3 + \frac{6}{x + 1}$. VA $x = -1$, SA $y = x - 3$.

- id: h2-t4
  soort: test
  niveau: 2
  thema: |-
    schetsen
  opgave: |-
    Schets $f(x) = \dfrac{x + 2}{x^2 - 1}$: domein, nulwaarde, asymptoten en tekentabel.
  antwoord: |-
    \tekentabel{cccccccc}{x & & -2 & & -1 & & 1 & }{f(x) & - & 0 & + & | & - & | & +}
  uitwerking: |-
    Domein $\R \setminus \{\pm 1\}$, nulwaarde $-2$, VA $x = \pm 1$, HA $y = 0$. \tekentabel{cccccccc}{x & & -2 & & -1 & & 1 & }{f(x) & - & 0 & + & | & - & | & +}
