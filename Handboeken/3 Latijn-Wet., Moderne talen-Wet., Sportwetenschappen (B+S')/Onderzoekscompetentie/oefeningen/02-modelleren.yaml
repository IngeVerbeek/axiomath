# Oefeningen van hoofdstuk 2. Zie oefeningenbank.py voor de velden.

- id: h2-start-1
  soort: start
  opgave: |-
    \blokkop{Opwarmer}
  lijst: reeks
  kolommen: 2
  delen:
    - opgave: |-
        Bereken het gemiddelde van $2, 4, 5, 4, 5$.
      antwoord: |-
        4
      uitwerking: |-
        $\frac{20}{5} = 4$.
    - opgave: |-
        Geef de rechte door $(0, 2)$ met richtingscoëfficiënt $0{,}5$.
      antwoord: |-
        $y = 0{,}5x + 2$
      uitwerking: |-
        $y = 0{,}5x + 2$.
    - opgave: |-
        Bereken $\ln 20$ en $\ln 40$. Hoeveel verschillen ze?
      antwoord: |-
        $\approx 3{,}00$; $\approx 3{,}69$; $\ln 2$
      uitwerking: |-
        $\ln 40 - \ln 20 = \ln 2 \approx 0{,}69$.
    - opgave: |-
        Hoe ziet de grafiek van $y = 3x^2$ eruit als je $y$ uitzet tegen $x^2$?
      antwoord: |-
        een rechte door de oorsprong
      uitwerking: |-
        Met $u = x^2$ is $y = 3u$: een rechte met richtingscoëfficiënt $3$.

- id: h2-verken
  soort: start
  figuur:
    opties: |-
      4.2cm
    code: |-
      \begin{tikzpicture}[x=.7cm,y=.5cm,font=\scriptsize]
        \rooster{0}{1}{5}{0}{1}{6}
        \foreach \x/\y in {1/2,2/4,3/5,4/4,5/5}{\fill[accent] (\x,\y) circle (2pt);}
      \end{tikzpicture}
  opgave: |-
    \blokkop{Verken} De figuur toont vijf metingen.
  lijst: enumerate
  delen:
    - opgave: |-
        Leg een lat op de figuur zodat ze \textit{zo goed mogelijk} bij de punten past. Teken de rechte en geef haar vergelijking.
      antwoord: |-
        ongeveer $y = 0{,}6x + 2{,}2$
      uitwerking: |-
        Iedereen vindt iets anders, ongeveer $y = 0{,}6x + 2{,}2$.
    - opgave: |-
        Vergelijk met een klasgenoot. Wat zou \textit{zo goed mogelijk} precies kunnen betekenen?
      antwoord: |-
        bijvoorbeeld: de afstanden tot de punten zo klein mogelijk
      uitwerking: |-
        Een afspraak is nodig: bijvoorbeeld dat de som van de (kwadraten van de) verticale afstanden minimaal is.

- id: h2-rechte
  soort: kort
  opgave: |-
    Bepaal de kleinste-kwadratenrechte en de correlatiecoëfficiënt voor de punten $(0, 1)$, $(1, 3)$, $(2, 2)$, $(3, 5)$, $(4, 4)$.
  antwoord: |-
    $y = 0{,}8x + 1{,}4$; $r = 0{,}8$
  uitwerking: |-
    $\xbar = 2$, $\ybar = 3$. Afwijkingen $x$: $-2, -1, 0, 1, 2$; $y$: $-2, 0, -1, 2, 1$. $\sum$ producten $= 4 + 0 + 0 + 2 + 2 = 8$, $\sum(x - \xbar)^2 = 10$, $\sum(y - \ybar)^2 = 10$. $a = 0{,}8$, $b = 3 - 1{,}6 = 1{,}4$, $r = \frac{8}{10} = 0{,}8$.

- id: h2-transformeren
  soort: kort
  opgave: |-
    Thee koelt af in een kamer van $20\,^\circ$C. Je meet de temperatuur $T$ om de 5 minuten: $90$; $74{,}5$; $62{,}5$; $53{,}1$; $45{,}8$. Je vermoedt $T - 20 = c \cdot g^t$. Hoe maak je dat lineair? Bereken $\ln(T - 20)$ en schat $g$ per minuut.
  antwoord: |-
    zet $\ln(T - 20)$ uit tegen $t$; $g \approx 0{,}951$
  uitwerking: |-
    $\ln(T - 20) = \ln c + t\ln g$. Waarden: $4{,}248$; $3{,}998$; $3{,}750$; $3{,}500$; $3{,}250$: elke 5 minuten ongeveer $-0{,}25$, dus $\ln g \approx -0{,}05$ en $g \approx \e^{-0{,}05} \approx 0{,}951$: ongeveer $5$\,\% minder temperatuurverschil per minuut.

- id: h2-kritisch
  soort: kort
  opgave: |-
    Wat is er mis met de redenering?
  lijst: enumerate
  delen:
    - opgave: |-
        \textit{Een plant groeide de eerste vijf weken telkens 3 cm. Na een jaar is ze dus 1{,}56 m.}
      antwoord: |-
        extrapolatie
      uitwerking: |-
        Het lineaire model is maar getest op vijf weken. Planten groeien niet onbeperkt lineair.
    - opgave: |-
        \textit{Leerlingen met meer schermtijd hebben lagere punten ($r = -0{,}4$). Minder schermtijd zal hun punten dus verhogen.}
      antwoord: |-
        correlatie is geen oorzaak
      uitwerking: |-
        Een negatieve correlatie bewijst geen oorzaak; andere factoren (slaap, motivatie) kunnen beide beïnvloeden. Bovendien is $r = -0{,}4$ maar een zwak verband.

#----------------------------------------------------------------------------------------
# OPDRACHTEN: door elkaar, eerst niveau 1, dan 2, dan 3
#----------------------------------------------------------------------------------------

- id: h2-o1
  soort: opdracht
  niveau: 1
  thema: |-
    een rechte bepalen
  opgave: |-
    Bepaal de kleinste-kwadratenrechte voor $(2, 3)$, $(4, 7)$, $(6, 8)$, $(8, 12)$. Voorspel $y$ voor $x = 5$.
  antwoord: |-
    $y = 1{,}4x + 0{,}5$; $7{,}5$
  uitwerking: |-
    $\xbar = 5$, $\ybar = 7{,}5$. $\sum(x - \xbar)(y - \ybar) = (-3)(-4{,}5) + (-1)(-0{,}5) + 1 \cdot 0{,}5 + 3 \cdot 4{,}5 = 28$, $\sum(x - \xbar)^2 = 20$. $a = 1{,}4$, $b = 7{,}5 - 7 = 0{,}5$. Voor $x = 5$: $7{,}5$.

- id: h2-o2
  soort: opdracht
  niveau: 1
  thema: |-
    een model kiezen
  opgave: |-
    Welk model past het best, en hoe maak je het lineair?
  lijst: enumerate
  delen:
    - opgave: |-
        Het aantal bacteriën verdubbelt ongeveer elk uur.
      antwoord: |-
        exponentieel; $\ln N$ tegen $t$
      uitwerking: |-
        $N = N_0 \cdot 2^t$: zet $\ln N$ uit tegen $t$.
    - opgave: |-
        De remafstand van een auto hangt af van het kwadraat van de snelheid.
      antwoord: |-
        macht; $s$ tegen $v^2$
      uitwerking: |-
        $s = c v^2$: zet $s$ uit tegen $v^2$.
    - opgave: |-
        De prijs van een taxirit: een vast bedrag plus een prijs per km.
      antwoord: |-
        lineair
      uitwerking: |-
        Al lineair: $p = a \cdot x + b$.

- id: h2-o3
  soort: opdracht
  niveau: 2
  thema: |-
    residuen
  opgave: |-
    Voor de punten uit voorbeeld~\ref{vb:h2-rechte} is de rechte $y = 0{,}6x + 2{,}2$. Bereken de vijf residuen en hun som. Wat valt op?
  antwoord: |-
    $-0{,}8$; $0{,}6$; $1$; $-0{,}6$; $-0{,}2$; som $0$
  uitwerking: |-
    Voorspellingen $2{,}8$; $3{,}4$; $4{,}0$; $4{,}6$; $5{,}2$. Residuen $-0{,}8$; $0{,}6$; $1{,}0$; $-0{,}6$; $-0{,}2$. De som is $0$: dat geldt altijd voor de kleinste-kwadratenrechte, omdat ze door $(\xbar, \ybar)$ gaat.

- id: h2-o4
  soort: opdracht
  niveau: 2
  thema: |-
    een eigen experiment
  opgave: |-
    Ontwerp een experiment dat je thuis kunt doen, met een verband dat je wiskundig wilt beschrijven (bijvoorbeeld: de hoogte van een stuiterende bal na elke bots, of de tijd om een fles leeg te laten lopen). Beschrijf: wat meet je, hoe vaak, welk model verwacht je, en hoe controleer je het.
  antwoord: |-
    open
  uitwerking: |-
    Bijvoorbeeld de stuiterbal: meet de hoogte na elke bots (minstens 5 bonsen, met een filmpje naast een meetlat). Verwacht model: elke keer dezelfde fractie, $h_n = h_0 \cdot q^n$. Controle: zet $\ln h_n$ uit tegen $n$ en kijk of de punten op een rechte liggen; bekijk de residuen.

- id: h2-o5
  soort: opdracht
  niveau: 3
  thema: |-
    de formule afleiden
  opgave: |-
    Neem eenvoudigheidshalve punten met $\xbar = 0$. Toon aan dat de som $S(a, b) = \sum (y_i - ax_i - b)^2$ minimaal is voor $b = \ybar$ en $a = \frac{\sum x_iy_i}{\sum x_i^2}$. Tip: beschouw $S$ eerst als functie van $b$ alleen (een parabool), daarna als functie van $a$.
  antwoord: |-
    bewijs
  uitwerking: |-
    Als functie van $b$: $S = nb^2 - 2b\sum(y_i - ax_i) + \ldots$, een dalparabool met top in $b = \frac1n\sum(y_i - ax_i) = \ybar - a\xbar = \ybar$. Als functie van $a$ (met $b = \ybar$): $S = a^2\sum x_i^2 - 2a\sum x_i(y_i - \ybar) + \ldots$, met top in $a = \frac{\sum x_i(y_i - \ybar)}{\sum x_i^2} = \frac{\sum x_iy_i}{\sum x_i^2}$ (want $\sum x_i = 0$). Dat is de formule uit het kader met $\xbar = 0$.

- id: h2-o6
  soort: opdracht
  niveau: 3
  thema: |-
    een gebogen verband
  opgave: |-
    De punten $(1, 1)$, $(2, 4)$, $(3, 9)$, $(4, 16)$, $(5, 25)$ liggen op een parabool. Bereken $r$. Is een hoge $r$ een bewijs voor een lineair verband? Wat tonen de residuen van de kleinste-kwadratenrechte?
  antwoord: |-
    $r \approx 0{,}98$; nee; residuen $+$, $-$, $-$, $-$, $+$
  uitwerking: |-
    $\xbar = 3$, $\ybar = 11$, $\sum(x - \xbar)(y - \ybar) = 60$, $\sum(x - \xbar)^2 = 10$, $\sum(y - \ybar)^2 = 374$: $r = \frac{60}{\sqrt{3740}} \approx 0{,}98$. De rechte is $y = 6x - 7$, met residuen $2$, $-1$, $-2$, $-1$, $2$: een duidelijk patroon, dus het lineaire model past niet, ondanks de hoge $r$.

#----------------------------------------------------------------------------------------
# KOPPEL
#----------------------------------------------------------------------------------------

- id: h2-koppel-1
  soort: koppel
  niveau: 2
  koppel:
    rubriek: analyse
    onderwerp: Afgeleiden
  thema: |-
    een rechte door de oorsprong
  opgave: |-
    Bij de slinger zoek je een rechte $y = ax$ door de oorsprong. Toon met een afgeleide aan dat $S(a) = \sum(y_i - ax_i)^2$ minimaal is voor $a = \frac{\sum x_iy_i}{\sum x_i^2}$.
  antwoord: |-
    bewijs
  uitwerking: |-
    $S'(a) = \sum 2(y_i - ax_i)(-x_i) = -2\sum x_iy_i + 2a\sum x_i^2 = 0$ geeft $a = \frac{\sum x_iy_i}{\sum x_i^2}$. $S''(a) = 2\sum x_i^2 > 0$: een minimum.

- id: h2-koppel-2
  soort: koppel
  niveau: 2
  koppel:
    rubriek: data
    onderwerp: Statistiek
  thema: |-
    steekproefvariabiliteit
  opgave: |-
    Twee klassen meten elk dezelfde slinger en vinden $g = 9{,}7$ en $g = 9{,}9$ m/s$^2$. Waarom verschillen de resultaten? Hoe zou je een betrouwbaarder resultaat krijgen?
  antwoord: |-
    meetfouten; meer en nauwkeurigere metingen
  uitwerking: |-
    Elke meting heeft toevallige fouten (reactietijd bij de chronometer, aflezen van de lengte). Meer metingen, en telkens de tijd voor tien slingeringen meten en delen door tien, maken het gemiddelde betrouwbaarder (zie Statistiek: de standaardafwijking van een gemiddelde daalt met $\sqrt n$).

- id: h2-t1
  soort: test
  niveau: 1
  thema: |-
    kleinste kwadraten
  opgave: |-
    Bepaal de kleinste-kwadratenrechte voor $(1, 1)$, $(2, 3)$, $(3, 2)$, $(4, 4)$, $(5, 5)$.
  antwoord: |-
    $y = 0{,}9x + 0{,}3$
  uitwerking: |-
    $\xbar = 3$, $\ybar = 3$. Afwijkingen $x$: $-2, -1, 0, 1, 2$; $y$: $-2, 0, -1, 1, 2$. $\sum$ producten $= 4 + 0 + 0 + 1 + 4 = 9$, $\sum(x - \xbar)^2 = 10$: $a = 0{,}9$, $b = 3 - 2{,}7 = 0{,}3$.

- id: h2-t2
  soort: test
  niveau: 2
  thema: |-
    lineariseren
  opgave: |-
    Een hoeveelheid medicijn in het bloed meet je om het uur: $100$; $80$; $64$; $51$; $41$ mg. Welk model vermoed je? Hoe controleer je het met een rechte? Schat de groeifactor per uur.
  antwoord: |-
    exponentieel; $\ln N$ tegen $t$; $g \approx 0{,}8$
  uitwerking: |-
    De verhoudingen zijn telkens ongeveer $0{,}8$: exponentieel verval $N = 100 \cdot 0{,}8^t$. Zet $\ln N$ uit tegen $t$: $4{,}61$; $4{,}38$; $4{,}16$; $3{,}93$; $3{,}71$, telkens ongeveer $-0{,}22 = \ln 0{,}8$.

- id: h2-t3
  soort: test
  niveau: 1
  thema: |-
    valkuilen
  opgave: |-
    In een gemeente stijgen tussen 2015 en 2024 het aantal fietspaden en het aantal fietsongevallen samen ($r = 0{,}9$). Een krant schrijft: \textit{fietspaden veroorzaken ongevallen}. Geef twee redenen waarom dat besluit niet volgt.
  antwoord: |-
    correlatie is geen oorzaak; een derde factor
  uitwerking: |-
    Correlatie is geen oorzaak. Een derde factor kan beide verklaren: er wordt meer gefietst, dus komen er fietspaden én meer ongevallen. Beter is het aantal ongevallen per gefietste kilometer te vergelijken.
